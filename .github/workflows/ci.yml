on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build and test
        working-directory: bindings/node
        run: |
          npm run build -- --target x86_64-unknown-linux-gnu
          npm test

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            musl: true
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build native addon
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: bindings/node/rbx_mesh.*.node
          if-no-files-found: error

  publish:
    name: Publish npm packages
    if: github.event_name == 'release'
    needs:
      - test
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        working-directory: bindings/node
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          release_version="${RELEASE_TAG#v}"
          test "$package_version" = "$release_version"
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Download native addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: bindings/node/artifacts
          merge-multiple: true
      - name: Stage npm platform packages
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts --npm-dir npm
      - name: Publish packages
        working-directory: bindings/node
        run: npm publish --access public
